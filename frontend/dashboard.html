<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="bg"></div>

<div class="dash-container">

  <div class="dash-card">

    <h1>📊 AI Resume Report</h1>

    <!-- SCORE -->
    <div class="score-circle">
      <span class="score" id="score">0</span>
      <small>ATS Score</small>
    </div>

    <!-- SKILLS -->
    <div class="section">
      <h3>💡 Skills Found</h3>
      <div class="skills" id="skills"></div>
    </div>

    <!-- FEEDBACK -->
    <div class="section">

      <div class="feedback-box">
        <h3>🔥 Strengths</h3>
        <ul id="strengths"></ul>
      </div>

      <div class="feedback-box">
        <h3>⚠️ Weakness</h3>
        <ul id="weakness"></ul>
      </div>

      <div class="feedback-box">
        <h3>🛠 Improvements</h3>
        <ul id="improvements"></ul>
      </div>

      <div class="feedback-box">
        <h3>💡 Suggestions</h3>
        <ul id="suggestions"></ul>
      </div>
      <div class="feedback-box">
  <h3>🧠 Interview Questions</h3>
  <ul id="questions"></ul>
</div>

<div class="feedback-box">
  <h3>💼 Recommended Job Role</h3>
  <p id="jobRole"></p>
</div>

    </div>

  </div>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
